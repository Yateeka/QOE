<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Behavior-Aware QoE Research Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand"><div class="brand-mark">Q<span>+</span></div><div class="brand-copy"><b>QoE Research</b><small>VIDEO BEHAVIOR LAB</small></div><button class="collapse-btn" id="collapseSidebar" aria-label="Collapse sidebar">‹</button></div>
      <div class="workspace"><span class="workspace-avatar">YA</span><span class="workspace-name">Research workspace<small>Local project</small></span><span class="chevron">⌄</span></div>
      <div class="nav-label">WORKSPACE</div><nav id="mainNav" class="main-nav"></nav>
      <div class="sidebar-bottom"><div class="pipeline-mini"><span class="pipeline-mini-icon">◉</span><span>Research pipeline<small>4 of 9 stages active</small></span><span class="pipeline-mini-dot"></span></div><div class="profile"><span class="profile-avatar">YG</span><span>Yateeka Goyal<small>Project owner</small></span><span class="profile-more">···</span></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button><div class="breadcrumbs"><span>QoE Research</span><b>/</b><strong id="crumb">Overview</strong></div><div class="top-actions"><span class="dataset-status"><i></i><span id="topStatus">Loading research data</span></span><button class="icon-btn" title="Notifications">♧</button><span class="top-avatar">YG</span></div></header>
      <section class="page-wrap" id="pageContent"><div class="loading"><span class="spinner"></span>Loading research workspace…</div></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
